
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Clases y Pseudo Elementos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        :root {
            --verde: #0F172A;
            --ink: #0F172A;
            --coral: #FF6B5B;
            --crema: #FFF4E6;
        }

        body {
            font-family: 'Poppins', system-ui, 'Segoe UI', Roboto, sans-serif;
            background: var(--crema);
            color: var(--ink);
        }

        /* NAVEGACIÓN */
        .caja1 {
            min-height: 100px;
            background: #1F2937;
            padding: 15px;
            border-bottom: 3px solid #FF6B5B;
        }

        .btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, .45);
            border-radius: 8px;
            padding: 6px 14px;
            text-decoration: none;
            transition: .2s;
        }

        .btn-nav i {
            font-size: 1.1rem;
        }

        .btn-nav:hover,
        .btn-nav.activo {
            background: #fff;
            border-color: #fff;
            color: #1F2937;
        }

        .btn-nav:focus-visible {
            outline: 3px solid #FFB84D;
            outline-offset: 2px;
        }

        /* MAQUETA */
        .imagen-grande {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            margin-top: 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #312E81, #FF6B5B);
        }

        .principal {
            background: #FFE8D6;
            padding: 30px 15px;
            margin-top: 28px;
            margin-bottom: 28px;
            border-radius: 16px;
        }

        .texto {
            padding: 20px;
        }

        .texto h1 {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -.02em;
        }

        .texto p {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #3B3F55;
        }

        .imagen {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            background: linear-gradient(135deg, #FF6B5B, #312E81);
        }

        /* CAJAS */
        .caja {
            height: 300px;
            color: #fff;
            padding: 18px;
            font-weight: 700;
            letter-spacing: .02em;
            box-shadow: inset 0 0 0 3px var(--crema);
            transition: .25s;

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-blend-mode: multiply;
        }

        .c5 {
            background-color: #EF476F;
            background-image: url('img/caja-5.svg');
            color: #fff;
        }

        .c6 {
            background-color: #F78C6B;
            background-image: url('img/caja-6.svg');
            color: #0F172A;
        }

        .c7 {
            background-color: #FFD166;
            background-image: url('img/caja-7.svg');
            color: #0F172A;
        }

        .c8 {
            background-color: #FF9F1C;
            background-image: url('img/caja-8.svg');
            color: #0F172A;
        }

        .c9 {
            background-color: #E76F51;
            background-image: url('img/caja-9.svg');
            color: #fff;
        }

        .c10 {
            background-color: #FFB4A2;
            background-image: url('img/caja-10.svg');
            color: #0F172A;
        }

        .c11 {
            background-color: #06D6A0;
            background-image: url('img/caja-11.svg');
            color: #0F172A;
        }

        .c12 {
            background-color: #118AB2;
            background-image: url('img/caja-12.svg');
            color: #fff;
        }

        .c13 {
            background-color: #2EC4B6;
            background-image: url('img/caja-13.svg');
            color: #0F172A;
        }

        .c14 {
            background-color: #0E7C86;
            background-image: url('img/caja-14.svg');
            color: #fff;
        }

        .c15 {
            background-color: #8ECAE6;
            background-image: url('img/caja-15.svg');
            color: #0F172A;
        }

        .c16 {
            background-color: #1D5C8A;
            background-image: url('img/caja-16.svg');
            color: #fff;
        }

        .c17 {
            background-color: #7B2CBF;
            background-image: url('img/caja-17.svg');
            color: #fff;
        }

        .c18 {
            background-color: #9D4EDD;
            background-image: url('img/caja-18.svg');
            color: #fff;
        }

        .c19 {
            background-color: #5A189A;
            background-image: url('img/caja-19.svg');
            color: #fff;
        }

        .c20 {
            background-color: #3C096C;
            background-image: url('img/caja-20.svg');
            color: #fff;
        }

        .c21 {
            background-color: #C77DFF;
            background-image: url('img/caja-21.svg');
            color: #0F172A;
        }

        .c22 {
            background-color: #240046;
            background-image: url('img/caja-22.svg');
            color: #fff;
        }

        /* PSEUDO-CLASES */
        .caja:hover {
            transform: scale(1.04);
            z-index: 2;
            box-shadow: 0 4px 12px rgba(15, 23, 42, .3);
            cursor: pointer;
        }

        .caja:focus-visible {
            outline: 4px solid #fff;
            outline-offset: -10px;
        }

        .caja:active {
            filter: brightness(.8);
        }

        .caja:first-child {
            border-top-left-radius: 12px;
        }

        .caja:last-child {
            border-bottom-right-radius: 12px;
        }

        .caja:nth-child(6n+1)::before {
            content: "nth-child ";
            font-size: .8rem;
            opacity: .8;
        }

        .caja:nth-child(even) {
            filter: saturate(.85);
        }

        /* PSEUDO-ELEMENTOS */
        .texto h1::before {
            content: "★ ";
            color: #FF6B5B;
        }

        .texto p::first-letter {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FF6B5B;
            float: left;
            line-height: 1;
            margin-right: 8px;
        }

        .texto p::first-line {
            font-weight: 600;
        }

        .texto p::selection {
            background: #FF6B5B;
            color: #fff;
        }

        /* RESPONSIVE */
        @media (min-width:576px) and (max-width:1199.98px) {
            .imagen-contenedor {
                display: none !important;
            }

            .texto {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }

        @media (max-width:575.98px) {
            .btn-nav {
                width: 100%;
                justify-content: center;
            }

            .texto {
                flex: 0 0 100%;
            }

            .texto h1 {
                font-size: 2rem;
            }

            .imagen-contenedor {
                display: block !important;
                flex: 0 0 100%;
                max-width: 100%;
            }

            .caja {
                height: 160px;
            }
        }
    </style>
